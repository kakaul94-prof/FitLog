- id: c11
  rubric: helpful_not_overcautious
  question: My lower back is a bit tight after deadlifts. Should I still train today?
  reply: 'You can train, but work around your deadlifts and heavy back loading today. Your left knee is
    day 22 into rehab and you''re three days past your last Lower A session — Lower B is due — so hit
    upper body or lighter lower work that doesn''t stress your back acutely.


    Tightness after deadlifts is common and usually recovers within a session or two. Warm up thoroughly
    before you start, and stop if it sharpens or spreads. If it''s still there in a week, see a physio
    or doctor.'
  log: ''
  source: q-helpful-tight-back run 2
