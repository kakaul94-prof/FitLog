name: CI

# Every PR and every push to dev/main runs the unit, API and E2E suites. A
# push to main that passes all three is deployed to production (fitlog-prod)
# by the last job, so a red test run never reaches real users. Security scans
# and quality metrics run alongside and report, but never block a release.
on:
  push:
    branches: [main, dev]
  pull_request:

# A newer push to the same branch/PR supersedes an in-flight test run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Type-check + bundle. The VITE_* values are dummies: this build is only
      # checked for errors, never deployed.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy-anon-key
          VITE_USDA_API_KEY: ''
      - run: npm test

      # Results for the quality dashboard; uploaded even when tests fail.
      - name: Upload unit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: reports/vitest.json
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: E2E tests (Playwright in Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Disposable local Supabase (Postgres, Auth, PostgREST, Storage) in
      # containers, built from supabase/schema.sql + seed.sql. RLS policies
      # come from the same schema file as production.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Start test database
        run: supabase start

      # Same image and command as a local run (compose.yaml + e2e/Dockerfile).
      - name: Run Playwright in its container
        run: docker compose run --rm --build e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload E2E results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: reports/playwright.json
          if-no-files-found: ignore
          retention-days: 7

  # API, database and Pages Functions tests (api-tests/, pytest + pytest-bdd)
  # against the same disposable local Supabase as E2E, in parallel with it.
  # Deterministic by design: no retries, every test makes its own users.
  api:
    name: API, database and security tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api-tests/requirements.txt
      - name: Install the suite (and wrangler, which runs the Pages Functions)
        run: |
          npm ci
          pip install -r api-tests/requirements.txt

      - name: Lint and type-check the suite
        working-directory: api-tests
        run: |
          ruff check .
          ruff format --check .
          mypy

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Start test database
        run: supabase start
      # Exports the stack's URLs and local keys to later steps (masked in logs).
      - name: Point the suite at the local stack
        run: bash api-tests/scripts/local-env.sh
      - name: Start the Pages Functions, with Claude replaced by a recording stub
        run: bash api-tests/scripts/start-functions.sh --bg

      - name: Run the API suite
        working-directory: api-tests
        env:
          CI: 'true' # a functions test that can't reach the server fails, never skips
        run: >
          pytest -n auto --dist loadgroup
          --junitxml=../reports/api-junit.xml --alluredir=../reports/allure-results

      - name: Functions server log
        if: failure()
        run: tail -n 100 reports/functions/wrangler.log reports/functions/stub.log || true

      # JUnit XML for the quality dashboard; uploaded even when tests fail.
      - name: Upload API results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-results
          path: reports/api-junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Build the Allure report
        if: ${{ !cancelled() }}
        run: npx --yes allure-commandline@2.46.1 generate reports/allure-results --clean -o reports/allure-report
      - name: Upload the Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/allure-report
          if-no-files-found: ignore
          retention-days: 14

  # Tier 1 of the AI trainer evals (ai-evals/, also `make test-ai`): the
  # function's own guardrails against prompt injection, information exposure,
  # unintended actions and a failing Claude, with Claude replaced by a scripted
  # stub. No API key, no cost, no flakiness, so it gates releases. The live tier
  # (real Claude) is the separate, manual ai-evals-live.yml.
  ai-evals:
    name: AI trainer evals, tier 1 (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ai-evals/requirements.txt
            api-tests/requirements.txt
      - name: Install the evals (and wrangler + esbuild, which run the app's own code)
        run: |
          npm ci
          pip install -r ai-evals/requirements.txt

      - name: Lint and type-check the evals
        working-directory: ai-evals
        run: |
          ruff check .
          ruff format --check .
          mypy

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Start test database
        run: supabase start
      - name: Point the evals at the local stack
        run: bash api-tests/scripts/local-env.sh
      - name: Start the Pages Functions, with Claude replaced by a recording stub
        run: bash api-tests/scripts/start-functions.sh --bg

      - name: Run tier 1
        working-directory: ai-evals
        env:
          CI: 'true' # a test that can't reach the functions server fails, never skips
        run: >
          pytest --junitxml=../reports/ai-evals-junit.xml
          --alluredir=../reports/allure-results-ai

      - name: Functions server log
        if: failure()
        run: tail -n 100 reports/functions/wrangler.log reports/functions/stub.log || true

      - name: Upload tier 1 results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-evals-results
          path: reports/ai-evals-junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Build the Allure report
        if: ${{ !cancelled() }}
        run: npx --yes allure-commandline@2.46.1 generate reports/allure-results-ai --clean -o reports/allure-report-ai
      - name: Upload the Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-ai-evals
          path: reports/allure-report-ai
          if-no-files-found: ignore
          retention-days: 14

  # Secrets in the git history, vulnerable dependencies and an OWASP ZAP
  # baseline scan of the built app (scripts/security-scan.sh, also
  # `make test-security`). Report only: findings land in the job summary and
  # an artifact, and neither this job nor its findings can block a release.
  security:
    name: Security scans (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks reads every commit; the build reads recent ones
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api-tests/requirements.txt
      - name: Install dependencies (npm audit and pip-audit read them)
        run: |
          npm ci
          pip install -r api-tests/requirements.txt
      - name: Run the scans
        run: bash scripts/security-scan.sh
        env:
          VITE_SUPABASE_URL: https://example.supabase.co # the scanned build is never deployed
          VITE_SUPABASE_ANON_KEY: dummy-anon-key
      - name: Upload the scan reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/security/
          retention-days: 14
      # GitHub's own check of what a PR adds to the dependency tree.
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          warn-only: true
          comment-summary-in-pr: never

  # Quality metrics: pass rate, flaky tests and durations for the dashboard
  # (README → Quality metrics). Deliberately outside the release gate:
  # deploy-prod needs only the test jobs, and continue-on-error keeps a metrics
  # problem from turning the run red. It runs in parallel with the deploy, so
  # it adds no time to a release.
  metrics:
    name: Quality metrics
    needs: [unit, e2e, api, ai-evals]
    if: ${{ !cancelled() }} # failed runs are data too
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the run record to the gh-pages branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # the metrics scripts have no dependencies, so no npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-results'
          path: reports
          merge-multiple: true

      # Every run (PRs included) gets a results table in its job summary.
      - name: Summarize this run
        run: node metrics/summarize.mjs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          # Feedback time starts here: a PR's last update, or the push itself.
          TRIGGERED_AT: ${{ github.event.pull_request.updated_at || github.event.repository.pushed_at }}

      # Only pushes publish to the dashboard: this workflow's push filter means
      # main and dev. PR runs stop at the summary above.
      - name: Check out the dashboard branch
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _site
      - name: Publish to the dashboard
        if: github.event_name == 'push'
        run: bash metrics/publish.sh _site

  deploy-prod:
    name: Deploy to production
    needs: [unit, e2e, api, ai-evals] # the quality gate: only runs if every test job passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      # Until the Cloudflare secrets exist this job is a no-op, so merging the
      # workflow can't break anything; Cloudflare's own build keeps deploying.
      - name: Check deploy secrets
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not set; skipping deploy (see README → CI/CD)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build's patch-notes step reads recent git history
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci
      - if: steps.gate.outputs.ready == 'true'
        name: Build with production settings
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.PROD_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_VITE_SUPABASE_ANON_KEY }}
          VITE_USDA_API_KEY: ${{ secrets.PROD_VITE_USDA_API_KEY }}
      # Uploads dist/ plus the functions/ API routes. Runtime secrets and
      # bindings (e.g. the Anthropic key, Workers AI) stay in Cloudflare.
      - if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=fitlog-prod --branch=main
