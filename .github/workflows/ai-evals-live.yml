# Tier 2 of the AI trainer evals: the eval dataset against the real Claude API,
# through the real Pages Function (ai-evals/aievals/live.py, also
# `make eval-ai-live`). Manual only: never on push, never part of the release
# gate, because it costs money and its answers vary run to run.
#
# Needs the ANTHROPIC_API_KEY_EVALS secret: a key from its own Anthropic
# workspace with a monthly spend limit, so an eval can never drain the balance
# the app's own AI features use. Hard limits per run: the call caps below
# (enforced again by the proxy), and live.py refuses any run whose worst case
# costs more than $10 (every reply at its token ceiling; real runs cost far
# less). Every user is synthetic and seeded into a throwaway local stack.
#
# GitHub only offers "Run workflow" once this file is on the default branch.
name: AI evals (live)

on:
  workflow_dispatch:
    inputs:
      reps:
        description: Runs per case
        default: '3'
        required: true
      only:
        description: Case ids to run, space-separated (blank runs every case)
        default: ''
        required: false
      max_trainer_calls:
        description: Hard cap on calls to Claude
        default: '450'
        required: true

concurrency:
  group: ai-evals-live
  cancel-in-progress: false

permissions:
  contents: write # append the run to data/ai-evals.json on the gh-pages branch

jobs:
  live:
    name: AI trainer evals, live tier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check the key is configured
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY_EVALS }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY_EVALS repository secret (a key with a spend limit)."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ai-evals/requirements.txt
            api-tests/requirements.txt
      - name: Install the evals
        run: |
          npm ci
          pip install -r ai-evals/requirements.txt

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Start test database
        # Supabase ports 54320-54329 sit in Linux's ephemeral range; reserve them so an outbound socket can't take 54322 first.
        run: |
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
          supabase start
      - name: Point the evals at the local stack
        run: bash api-tests/scripts/local-env.sh

      # Inputs reach the shell only through env and are validated, never
      # interpolated into the script.
      - name: Run the live tier
        working-directory: ai-evals
        env:
          ANTHROPIC_API_KEY_EVALS: ${{ secrets.ANTHROPIC_API_KEY_EVALS }}
          REPS: ${{ inputs.reps }}
          ONLY: ${{ inputs.only }}
          MAX_CALLS: ${{ inputs.max_trainer_calls }}
        run: |
          [[ "$REPS" =~ ^[1-5]$ ]] || { echo "::error::reps must be 1-5"; exit 1; }
          [[ "$MAX_CALLS" =~ ^[0-9]{1,3}$ ]] || { echo "::error::max_trainer_calls must be 0-999"; exit 1; }
          args=(--reps "$REPS" --max-trainer-calls "$MAX_CALLS")
          if [ -n "$ONLY" ]; then
            read -ra ids <<<"$ONLY"
            for id in "${ids[@]}"; do
              [[ "$id" =~ ^[a-z0-9-]+$ ]] || { echo "::error::bad case id: $id"; exit 1; }
            done
            args+=(--only "${ids[@]}")
          fi
          python -m aievals.live "${args[@]}"

      - name: Functions server log
        if: failure()
        run: tail -n 100 reports/functions/wrangler.log || true

      # Every run is data, including one that missed its bars.
      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-evals-live
          path: reports/ai-evals-live
          if-no-files-found: ignore
          retention-days: 30
      - name: Check out the dashboard branch
        if: ${{ !cancelled() }}
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _site
      - name: Publish to the dashboard
        if: ${{ !cancelled() }}
        run: bash ai-evals/scripts/publish-live.sh _site
