name: CI

# Every PR and every push to dev/main runs unit + E2E tests. A push to main
# that passes both is deployed to production (fitlog-prod) by the last job,
# so a red test run never reaches real users.
on:
  push:
    branches: [main, dev]
  pull_request:

# A newer push to the same branch/PR supersedes an in-flight test run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Type-check + bundle. The VITE_* values are dummies: this build is only
      # checked for errors, never deployed.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy-anon-key
          VITE_USDA_API_KEY: ''
      - run: npm test

  e2e:
    name: E2E tests (Playwright in Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Disposable local Supabase (Postgres, Auth, PostgREST, Storage) in
      # containers, built from supabase/schema.sql + seed.sql. RLS policies
      # come from the same schema file as production.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Start test database
        run: supabase start

      # Same image and command as a local run (compose.yaml + e2e/Dockerfile).
      - name: Run Playwright in its container
        run: docker compose run --rm --build e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy-prod:
    name: Deploy to production
    needs: [unit, e2e] # the quality gate: only runs if both test jobs passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      # Until the Cloudflare secrets exist this job is a no-op, so merging the
      # workflow can't break anything; Cloudflare's own build keeps deploying.
      - name: Check deploy secrets
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN not set; skipping deploy (see README → CI/CD)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build's patch-notes step reads recent git history
      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci
      - if: steps.gate.outputs.ready == 'true'
        name: Build with production settings
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.PROD_VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_VITE_SUPABASE_ANON_KEY }}
          VITE_USDA_API_KEY: ${{ secrets.PROD_VITE_USDA_API_KEY }}
      # Uploads dist/ plus the functions/ API routes. Runtime secrets and
      # bindings (e.g. the Anthropic key, Workers AI) stay in Cloudflare.
      - if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=fitlog-prod --branch=main
