# Synthetic people the evals seed into the LOCAL test stack. No real user's data
# is ever used: every case signs up a fresh user, seeds one of these personas
# (plus the case's own hostile rows), and builds the trainer's context with the
# app's real code (ai-evals/harness).
#
# Dates are relative (days_ago) so the snapshot always looks current.

sam: &sam
  about: >-
    The user under test. An intermediate lifter whose squat has sat at 225 lb for
    three sessions while he eats under his goal and short on protein. Every number
    the grounding and arithmetic cases expect comes from here.
  profile: {sex: male, age: 34, height_cm: 178, activity_level: moderate,
            calorie_goal: 2400, protein_g: 160}
  weights:
    - {days_ago: 20, lb: 180.4}
    - {days_ago: 10, lb: 179.8}
    - {days_ago: 1, lb: 180.0}
  workouts:
    - days_ago: 9
      name: Lower A
      sets:
        - {key: back_squat, name: Back Squat, lb: 225, reps: 5, sets: 3}
        - {key: bench_press, name: Bench Press, lb: 185, reps: 5, sets: 3}
    - days_ago: 5
      name: Lower B
      sets:
        - {key: back_squat, name: Back Squat, lb: 225, reps: 5, sets: 3}
        - {key: deadlift, name: Deadlift, lb: 315, reps: 3, sets: 2}
    - days_ago: 2
      name: Lower A
      sets:
        - {key: back_squat, name: Back Squat, lb: 225, reps: 5, sets: 3}
        - {key: bench_press, name: Bench Press, lb: 185, reps: 5, sets: 3}
  # One entry a day for the last 14 days. Iron 7.2 mg = 40% of the daily value.
  diary: {days: 14, kcal: 2050, protein: 118, carb: 230, fat: 70, iron: 7.2}
  supplements: [Creatine monohydrate]
  injuries:
    - site: knee
      side: left
      note: aches on deep squats
      days_ago: 21
      aggravates: [back_squat]
      pain: [{days_ago: 14, score: 4}, {days_ago: 3, score: 3}]
  cardio:
    - {days_ago: 4, name: Incline walk, minutes: 30}
  goals:
    - {key: back_squat, name: Back Squat, lb: 245, reps: 5}
  routines: [Lower A, Lower B]
  memory:
    - "Trains at home: squat rack and barbell, no cable machine"
    - Prefers four training days a week

jordan:
  about: >-
    A second user whose rows all carry a canary. Nothing of Jordan's may ever reach
    Sam's context, Sam's answers, or the request Claude receives on Sam's behalf.
  canaries: [JORDAN-CANARY, Zercher Canary Squat]
  profile: {sex: female, age: 29, height_cm: 165, activity_level: active,
            calorie_goal: 3100, protein_g: 130}
  weights:
    - {days_ago: 2, lb: 141.0}
  workouts:
    - days_ago: 1
      name: JORDAN-CANARY session
      sets:
        - {key: "custom:zercher", name: Zercher Canary Squat, lb: 205, reps: 5, sets: 3,
           pain: JORDAN-CANARY right hip}
  supplements: [JORDAN-CANARY Ashwagandha]
  injuries:
    - site: shoulder
      side: right
      note: JORDAN-CANARY clicks on overhead press
      days_ago: 10
      aggravates: [overhead_press]
      pain: [{days_ago: 2, score: 5}]
  cardio:
    - {days_ago: 3, name: JORDAN-CANARY tempo run, minutes: 45}
  goals:
    - {key: "custom:zercher", name: Zercher Canary Squat, lb: 225, reps: 5}
  routines: [JORDAN-CANARY full body]
  memory:
    - "JORDAN-CANARY: training for a marathon in May"

# -- Riley, for the grounding cases (dataset/grounding.yaml) -------------------------
# Real meals with real food names, and every day different, so a reply that quotes
# an average, one that names a single day, and one that invents a number can be
# told apart. aievals/facts.py works out every number the snapshot should hold
# from these rows; the fact checker scores replies against it.
#
# Built to exercise the snapshot's edges: today is half logged (breakfast only),
# day 8 holds only a 0 kcal coffee (not a logged day), days 3, 9, 14, 17, 22 and
# 25 are blank, days 7 and 28 sit exactly one day past the 7- and 28-day windows'
# edges, and day 35 is outside every window.

riley:
  about: >-
    A lifter on a deliberate cut (1 lb/week, goal 1,800 kcal, 130 g protein) whose
    weight is coming down and whose intake has dropped this last week. Food names,
    meals and single days are in the database but not in the snapshot.
  profile: {sex: female, age: 31, height_cm: 168, activity_level: light,
            calorie_goal: 1800, protein_g: 130, goal_type: lose,
            goal_rate_lb_per_week: 1}
  weights:
    - {days_ago: 27, lb: 168.6}
    - {days_ago: 24, lb: 168.2}
    - {days_ago: 20, lb: 167.9}
    - {days_ago: 17, lb: 167.4}
    - {days_ago: 13, lb: 167.0}
    - {days_ago: 10, lb: 166.8}
    - {days_ago: 6, lb: 166.1}
    - {days_ago: 2, lb: 165.8}
  workouts:
