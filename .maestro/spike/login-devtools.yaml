appId: app.fitlog.mobile
name: login-devtools
androidWebViewHierarchy: devtools
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "email"
    timeout: 90000
- takeScreenshot: reports/android/shots/03-login-devtools
- tapOn:
    id: "email"
- inputText: ${MAESTRO_FITLOG_EMAIL}
- tapOn:
    id: "password"
- inputText: ${MAESTRO_FITLOG_PASSWORD}
- hideKeyboard
# The card title and the submit button both read "Sign in"; the button is second.
- tapOn:
    text: "Sign in"
    index: 1
- extendedWaitUntil:
    visible: "Breakfast"
    timeout: 90000
- takeScreenshot: reports/android/shots/04-diary-devtools
# Bottom-nav tab, then the hardware back button (MainActivity's dispatcher).
- tapOn: "Progress"
- extendedWaitUntil:
    visible: "Log weight (lb)"
    timeout: 30000
- takeScreenshot: reports/android/shots/05-progress-devtools
- back
- extendedWaitUntil:
    visible: "Breakfast"
    timeout: 30000
- takeScreenshot: reports/android/shots/06-back-to-diary
