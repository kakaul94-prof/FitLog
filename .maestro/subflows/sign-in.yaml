# Fresh install state, then sign in as the test account; ends on the diary.
# Credentials come from the environment (MAESTRO_FITLOG_EMAIL / _PASSWORD).
appId: app.fitlog.mobile
---
# Background, then stop, then clear. Clearing an app's data removes its task,
# and the fresh launch (launchMode singleTask) joins that task if it still
# exists: if the old window is still animating out, Android finishes the
# removal about a second later by killing the task, new launch included (a
# blank screen). Going Home first leaves no window to animate out, so the
# stop and the clear end the old task at once.
- pressKey: Home
- stopApp
- launchApp:
    clearState: true
# The first launch after an install also starts the WebView, so allow longer.
- extendedWaitUntil:
    visible:
      id: "email"
    timeout: 90000
- tapOn:
    id: "email"
- inputText: ${MAESTRO_FITLOG_EMAIL}
- tapOn:
    id: "password"
- inputText: ${MAESTRO_FITLOG_PASSWORD}
- hideKeyboard
- tapOn:
    id: "sign-in-submit"
- extendedWaitUntil:
    visible: ".*calories remaining"
    timeout: 60000
