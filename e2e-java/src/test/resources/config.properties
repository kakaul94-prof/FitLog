# Defaults for a local run. Override any key with -D<key>=value or with the environment
# variable named next to it in Config.java (FITLOG_BASE_URL, SUPABASE_URL, BROWSER, HEADLESS,
# TIMEOUT_SECONDS). Precedence: -D, then environment, then this file.
#
# No keys live here. SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY are read from the
# environment only; scripts/start-app.sh exports them from the running local stack.

# The Vite dev server that scripts/start-app.sh starts, pointed at the local Supabase stack.
base.url=http://localhost:5174
# The Supabase CLI's local stack (`npm run db:start`). Any non-local host is refused.
supabase.url=http://127.0.0.1:54321

# chrome | firefox
browser=chrome
headless=false
# Explicit-wait timeout for every page object and API poll.
timeout.seconds=10
