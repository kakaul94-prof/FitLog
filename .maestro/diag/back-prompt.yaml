# TEMPORARY diagnostic (not part of the suite): does Maestro see the
# "Save changes?" prompt when it is raised by the in-app Back button (A) and
# by the hardware back button (B)? Every probe is optional, so the flow runs
# to the end and the screenshots + log say what was seen. run.sh then dumps a
# fresh hierarchy with the prompt still open.
appId: app.fitlog.mobile
name: diag-back-prompt
onFlowStart:
  - runScript:
      file: ../scripts/db.js
      env:
        ACTION: reset
---
- runFlow: ../subflows/sign-in.yaml
- runFlow:
    file: ../subflows/quick-add.yaml
    env:
      NAME: "Diag ${output.runId}"
      KCAL: "100"

# A: the page's own Back button (React Router nav(-1)).
- tapOn: "Diag ${output.runId} 100"
- tapOn:
    id: "srv"
- eraseText: 10
- inputText: "3"
- hideKeyboard
- tapOn:
    text: "Back"
    index: 0
    optional: true
- extendedWaitUntil:
    visible: "Save changes\\?"
    timeout: 10000
    optional: true
- takeScreenshot: reports/android/diag/A-after-in-app-back
- tapOn:
    text: "Keep editing"
    optional: true

# B: the hardware back button (MainActivity -> WebView.goBack()).
- back
- extendedWaitUntil:
    visible: "Save changes\\?"
    timeout: 10000
    optional: true
- takeScreenshot: reports/android/diag/B-after-hardware-back
# B2: does any later screen event refresh what Maestro sees?
# (a no-op if the overlay blocks scrolling; it still makes the WebView redraw)
- scroll
- extendedWaitUntil:
    visible: "Save changes\\?"
    timeout: 10000
    optional: true
- takeScreenshot: reports/android/diag/B2-after-scroll
