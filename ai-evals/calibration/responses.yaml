- id: c01
  rubric: grounded_in_log
  question: Am I eating enough protein for my bodyweight?
  reply: 'No. You''re averaging 118 g protein per day, which is 0.66 g per lb of bodyweight. For lifting—especially
    with a stalled squat and an open knee injury that needs recovery support—you need 0.7–1.0 g per lb.
    At 180 lb, that''s 126–180 g daily. You''re short by roughly 10–60 g depending on your target.


    Add one palm-sized serving of protein at a meal or two: chicken, fish, Greek yogurt, or a shake. Even
    hitting 140 g would move you into the zone where strength gains and recovery are no longer limited
    by intake.'
